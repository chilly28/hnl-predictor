name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ["site/data/**", "data/matches.csv", "data/forecast_archive.json", "data/state.json"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Offline pipeline smoke test
        run: |
          python -m hnl_predictor update --offline
          python -m hnl_predictor build --sims 500
