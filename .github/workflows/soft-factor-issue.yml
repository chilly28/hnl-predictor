name: Soft factor from issue

# Lets the repository owner add a soft factor from a phone: open an issue with the
# "Meki faktor / Soft factor" form. Issues from anyone else are ignored.
on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: soft-factor-issues
  cancel-in-progress: false

jobs:
  add:
    if: >-
      github.event.issue.state == 'open' &&
      github.event.issue.user.login == github.repository_owner &&
      (startsWith(github.event.issue.title, '[Meki faktor]') ||
       contains(github.event.issue.labels.*.name, 'soft-factor'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Validate and add the factor
        id: add
        # The issue body is read from the event file, never interpolated into the shell.
        run: python -m hnl_predictor add-factor --issue-event "$GITHUB_EVENT_PATH" --result "$RUNNER_TEMP/result.md"

      - name: Commit
        if: steps.add.outputs.ok == 'true'
        env:
          ISSUE: ${{ github.event.issue.number }}
        run: |
          git config user.name "hnl-predictor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/soft_factors.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Soft factor from issue #${ISSUE}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep $((i * 5))
          done

      - name: Rebuild forecasts
        if: steps.add.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # Pushes made with GITHUB_TOKEN do not start other workflows, so start the update explicitly.
        run: gh workflow run update.yml --ref main --repo "${{ github.repository }}"

      - name: Report on the issue
        if: always() && steps.add.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh label create soft-factor --color 1c5cab --description "Soft factor for the forecasts" --repo "${{ github.repository }}" 2>/dev/null || true
          if [ -f "$RUNNER_TEMP/result.md" ]; then
            gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/result.md" --repo "${{ github.repository }}"
          else
            gh issue comment "$ISSUE" --body "❌ Obrada nije uspjela, pogledajte log / processing failed, see the workflow log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --repo "${{ github.repository }}"
          fi
          if [ "${{ steps.add.outputs.ok }}" = "true" ]; then
            gh issue edit "$ISSUE" --add-label soft-factor --repo "${{ github.repository }}" || true
            gh issue close "$ISSUE" --reason completed --repo "${{ github.repository }}"
          fi
