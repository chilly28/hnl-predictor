name: Probe data sources
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        shell: python
        run: |
          import json, urllib.request, time
          UA = "hnl-predictor/0.1 (+https://github.com/chilly28/hnl-predictor)"
          def get(u, t=30):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": UA}), timeout=t)
                  return r.status, r.read().decode("utf-8", "replace")
              except Exception as e:
                  return None, repr(e)
          B = "https://www.thesportsdb.com/api/v1/json/123/"
          for path in ["eventsnext.php?id=134019", "eventslast.php?id=134019", "eventsnext.php?id=133961", "eventslast.php?id=133961",
                       "eventsround.php?id=5071&r=1&s=2026-2027", "eventsround.php?id=5071&r=4&s=2026-2027", "eventsround.php?id=5071&r=7&s=2026-2027",
                       "eventsround.php?id=4481&r=7&s=2026-2027", "eventsround.php?id=4629&r=1&s=2025-2026", "eventsround.php?id=4629&r=36&s=2025-2026",
                       "lookup_all_teams.php?id=4629"]:
              st, body = get(B + path)
              print("=====", path, st)
              try:
                  d = json.loads(body)
                  for k, v in d.items():
                      if isinstance(v, list):
                          print(k, len(v))
                          for e in v[:20]:
                              print(json.dumps({x: e.get(x) for x in ("idEvent","strLeague","idLeague","strSeason","intRound","strTimestamp","strHomeTeam","strAwayTeam","intHomeScore","intAwayScore","strStatus","idTeam","strTeam","strTeamAlternate")}, ensure_ascii=False))
                      else:
                          print(k, str(v)[:200])
              except Exception as e:
                  print("not json", body[:300])
              time.sleep(2.5)
          for u in []:
              st, body = get(u, 60); print("=====", u, st, body[:500])
          W = "https://en.wikipedia.org/w/api.php?action=parse&prop=wikitext&format=json&formatversion=2&page="
          for p in ["2026%E2%80%9327_UEFA_Europa_League_league_phase"]:
              st, body = get(W + p)
              try:
                  wt = json.loads(body)["parse"]["wikitext"]
                  i = wt.find("Results")
                  print("=====", p, len(wt)); print(wt[i:i+3000])
              except Exception as e:
                  print("=====", p, st, body[:300])
