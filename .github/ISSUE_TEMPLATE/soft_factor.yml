name: "Meki faktor / Soft factor"
description: "Dodaj meki faktor koji pomiče prognozu (samo vlasnik repozitorija) / Add a soft factor (repository owner only)"
title: "[Meki faktor] "
labels: ["soft-factor"]
# Generated by hnl_predictor/factor_issue.py – edit there.
body:
  - type: markdown
    attributes:
      value: |
        Ispunite polja i spremite. Automatika provjerava unos, dodaje ga u `data/soft_factors.yaml`,
        ponovno računa prognoze i zatvara issue. Pogreške dobivate kao komentar.
        Fill in the fields and submit; a workflow validates the entry, adds it to `data/soft_factors.yaml`,
        rebuilds the forecasts and closes the issue. Errors come back as a comment.

        25 Elo bodova ≈ 3–4 postotna boda vjerojatnosti pobjede / 25 Elo points ≈ 3–4 percentage points of win probability.
  - type: dropdown
    id: team
    attributes:
      label: "Klub / Club"
      options:
        - "Dinamo Zagreb"
        - "Gorica"
        - "Hajduk Split"
        - "Istra 1961"
        - "Lokomotiva Zagreb"
        - "Osijek"
        - "Rijeka"
        - "Rudeš"
        - "Slaven Belupo"
        - "Varaždin"
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: "Vrsta / Type"
      options:
        - "injury – ozljeda / injury (max ±50)"
        - "suspension – suspenzija / suspension (max ±40)"
        - "coach_change – promjena trenera / coach change (max ±40)"
        - "tactical – taktika / tactics (max ±25)"
        - "unrest – nemiri, prosvjedi / unrest, protests (max ±40)"
        - "media – mediji / media (max ±15)"
        - "fatigue – umor, raspored / fatigue, schedule (max ±25)"
        - "other – ostalo / other (max ±25)"
    validations:
      required: true
  - type: input
    id: adjustment
    attributes:
      label: "Pomak u Elo bodovima / Adjustment (Elo points)"
      description: "Negativno = slabiji, pozitivno = jači / negative = weaker, positive = stronger. Npr. / e.g. -25"
      placeholder: "-25"
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: "Vrijedi od / From (YYYY-MM-DD)"
      description: "Npr. / e.g. 2026-10-15 ili / or 15.10.2026."
      placeholder: "2026-10-15"
    validations:
      required: true
  - type: input
    id: until
    attributes:
      label: "Vrijedi do / Until (optional)"
      description: "Prazno = 14 dana / empty = 14 days"
  - type: textarea
    id: note
    attributes:
      label: "Kratka bilješka / Short note"
      description: "Prikazuje se na stranici / shown on the website (max 300)"
      placeholder: "Prvi napadač ozlijeđen 2-3 tjedna / First-choice striker out for 2-3 weeks"
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: "Izvor / Source link (optional)"
      placeholder: "https://..."
