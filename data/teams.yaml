# Canonical team ids, display names and aliases used by the data sources.
# Teams not listed here get an automatic id (name without "NK/HNK/GNK" prefix,
# lowercase, no diacritics). Add aliases when a source spells a club differently.
#
# clubelo: the club's name in the ClubElo API (http://clubelo.com), used to
#          calibrate HNL strength against foreign opponents.
# short:   3-letter code shown on small screens.

