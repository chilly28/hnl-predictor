[project]
name = "hnl-predictor"
version = "1.0.0"
description = "Match forecasts for the Croatian football league (SuperSport HNL) and Croatian clubs in Europe"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "PyYAML>=6.0", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hnl-predictor = "hnl_predictor.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hnl_predictor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
